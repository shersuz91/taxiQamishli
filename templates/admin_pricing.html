{% extends "admin_base.html" %}
{% block title %}التسعير | تاكسي أمان{% endblock %}
{% block content %}
<header class="admin-header"><div><p class="eyebrow">إعدادات الأعمال</p><h1>التسعير</h1></div></header>
<form method="post" class="admin-form admin-section settings-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="base_fare">الأجرة الأساسية (ل.س)</label>
    <input id="base_fare" name="base_fare" type="number" min="0" step="0.01" value="{{ settings.base_fare }}" required>
    <label for="price_per_km">السعر لكل كيلومتر (ل.س)</label>
    <input id="price_per_km" name="price_per_km" type="number" min="0" step="0.01" value="{{ settings.price_per_km }}" required>
    <label for="minimum_fare">الحد الأدنى للأجرة (ل.س)</label>
    <input id="minimum_fare" name="minimum_fare" type="number" min="0" step="0.01" value="{{ settings.minimum_fare }}" required>
    <label for="additional_fee">رسوم إضافية (ل.س)</label>
    <input id="additional_fee" name="additional_fee" type="number" min="0" step="0.01" value="{{ settings.additional_fee }}" required>
    <button type="submit" class="admin-primary">حفظ التسعير</button>
</form>
{% endblock %}
