<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة | تاكسي أمان</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-login-page">
    <main class="login-panel">
        <p class="login-eyebrow">تاكسي أمان</p>
        <h1>تسجيل دخول الإدارة</h1>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}<div class="alert alert-danger">{{ message }}</div>{% endfor %}
        {% endwith %}
        <form method="post" class="admin-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="username">اسم المستخدم</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">كلمة المرور</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit" class="admin-primary">تسجيل الدخول</button>
        </form>
    </main>
</body>
</html>
