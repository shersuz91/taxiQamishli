<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}لوحة الإدارة | تاكسي أمان{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
    <div class="admin-shell">
        <aside class="admin-nav">
            <a class="admin-brand" href="{{ url_for('admin_dashboard') }}">تاكسي أمان <span>إدارة</span></a>
            <nav>
                <a href="{{ url_for('admin_dashboard') }}"><i class="bi bi-grid-1x2"></i> لوحة التحكم</a>
                <a href="{{ url_for('admin_bookings') }}"><i class="bi bi-receipt"></i> الحجوزات</a>
                <a href="{{ url_for('admin_pricing') }}"><i class="bi bi-cash-stack"></i> التسعير</a>
                <a href="{{ url_for('admin_service_area') }}"><i class="bi bi-bullseye"></i> منطقة الخدمة</a>
                <a href="{{ url_for('admin_general') }}"><i class="bi bi-sliders"></i> الإعدادات العامة</a>
            </nav>
            <form method="post" action="{{ url_for('admin_logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit"><i class="bi bi-box-arrow-right"></i> تسجيل الخروج</button>
            </form>
        </aside>
        <main class="admin-content">
            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="alert alert-info" role="alert">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin=""></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
